<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      th:lang="en">
<head>
    <title>Taco Cloud</title>
    <link rel="stylesheet" th:href="@{/styles.css}"/>
</head>
<body>
<form method="POST" th:action="@{/orders}" th:object="${tacoOrder}">
    <h1>Order your taco creations!</h1>
    <img th:src="@{/images/TacoCloud.png}" alt="Taco Cloud logo"/>

    <h3>Your tacos in this order:</h3>
    <a th:href="@{/design}" id="another">Design another taco</a>
    <ul>
        <li th:each="taco : ${tacoOrder.tacos}">
            <span th:text="${taco.name}">taco name</span>
        </li>
    </ul>

    <div class="form-section">
        <h3>Deliver my taco masterpieces to...</h3>

        <div class="form-field">
            <label for="deliveryName">Name</label>
            <input id="deliveryName" type="text" th:field="*{deliveryName}"
                   th:classappend="${#fields.hasErrors('deliveryName')} ? 'field-invalid' : ''"/>
            <span class="validationError"
                  th:if="${#fields.hasErrors('deliveryName')}"
                  th:errors="*{deliveryName}">Delivery name error</span>
        </div>

        <div class="form-field">
            <label for="deliveryStreet">Street address</label>
            <input id="deliveryStreet" type="text" th:field="*{deliveryStreet}"
                   th:classappend="${#fields.hasErrors('deliveryStreet')} ? 'field-invalid' : ''"/>
            <span class="validationError"
                  th:if="${#fields.hasErrors('deliveryStreet')}"
                  th:errors="*{deliveryStreet}">Street error</span>
        </div>

        <div class="form-field">
            <label for="deliveryCity">City</label>
            <input id="deliveryCity" type="text" th:field="*{deliveryCity}"
                   th:classappend="${#fields.hasErrors('deliveryCity')} ? 'field-invalid' : ''"/>
            <span class="validationError"
                  th:if="${#fields.hasErrors('deliveryCity')}"
                  th:errors="*{deliveryCity}">City error</span>
        </div>

        <div class="form-field">
            <label for="deliveryState">State</label>
            <input id="deliveryState" type="text" th:field="*{deliveryState}"
                   th:classappend="${#fields.hasErrors('deliveryState')} ? 'field-invalid' : ''"/>
            <span class="validationError"
                  th:if="${#fields.hasErrors('deliveryState')}"
                  th:errors="*{deliveryState}">State error</span>
        </div>

        <div class="form-field">
            <label for="deliveryZip">Zip code</label>
            <input id="deliveryZip" type="text" th:field="*{deliveryZip}"
                   th:classappend="${#fields.hasErrors('deliveryZip')} ? 'field-invalid' : ''"/>
            <span class="validationError"
                  th:if="${#fields.hasErrors('deliveryZip')}"
                  th:errors="*{deliveryZip}">Zip error</span>
        </div>
    </div>

    <div class="form-section">
        <h3>Here's how I'll pay...</h3>

        <div class="form-field">
            <label for="ccNumber">Credit Card #</label>
            <input id="ccNumber" type="text" th:field="*{ccNumber}"
                   th:classappend="${#fields.hasErrors('ccNumber')} ? 'field-invalid' : ''"/>
            <span class="validationError"
                  th:if="${#fields.hasErrors('ccNumber')}"
                  th:errors="*{ccNumber}">Credit card error</span>
        </div>

        <div class="form-field">
            <label for="ccExpiration">Expiration (MM/YY)</label>
            <input id="ccExpiration" type="text" th:field="*{ccExpiration}"
                   th:classappend="${#fields.hasErrors('ccExpiration')} ? 'field-invalid' : ''"/>
            <span class="validationError"
                  th:if="${#fields.hasErrors('ccExpiration')}"
                  th:errors="*{ccExpiration}">Expiration error</span>
        </div>

        <div class="form-field">
            <label for="ccCVV">CVV</label>
            <input id="ccCVV" type="text" th:field="*{ccCVV}"
                   th:classappend="${#fields.hasErrors('ccCVV')} ? 'field-invalid' : ''"/>
            <span class="validationError"
                  th:if="${#fields.hasErrors('ccCVV')}"
                  th:errors="*{ccCVV}">CVV error</span>
        </div>
    </div>

    <input type="submit" value="Submit Order"/>
</form>
</body>
</html>
